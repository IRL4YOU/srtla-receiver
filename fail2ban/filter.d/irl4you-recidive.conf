# Wiederholungstaeter: Wer innerhalb der Beobachtungszeit zehnmal von fail2ban gesperrt wurde (SSH oder Weboberflaeche),
# wird fuer eine Woche gesperrt. Gezaehlt werden nur neue Sperren ("Ban"), nicht das Wiederherstellen nach einem Neustart
# ("Restore Ban") und nicht die Sperren der Wochensperre selbst.
[Definition]
failregex = fail2ban\.actions\s+\[\d+\]:\s+NOTICE\s+\[(?:sshd|irl4you-web)\]\s+Ban\s+<HOST>\s*$
ignoreregex =
