# Fehlgeschlagene Anmeldung an der IRL4YOU-Verwaltung. Die Verwaltung schreibt pro Fehlversuch eine Zeile
# "IRL4YOU-AUTH-FAIL ip=<Adresse> user=<Name>" in das Container-Log (Docker-JSON-Log). Die Zeit wird aus der
# Docker-Zeit am Zeilenende gelesen (UTC mit Z), unabhaengig von der Zeitzone des Rechners. IPv4 und IPv6.
[Definition]
failregex = IRL4YOU-AUTH-FAIL ip=<ADDR>
ignoreregex =
datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%S(?:\.\d+)?%%z
