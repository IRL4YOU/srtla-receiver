srt {
    worker_threads 1;
    worker_connections 300;
    # Pufferberechnung fuer bis zu 20 Mbit/s und 8 Sekunden SRT-Latenz.
    # Damit sind Senderprofile mit 4000 und 6000 ms samt Reserve vorgesehen.
    rcv_sizing_max_bitrate_kbps 20000;
    rcv_sizing_max_latency_ms 8000;
    http_port 8182;
    http_bind_addr 127.0.0.1;
    # Der Platzhalter wird beim Containerstart durch einen zufaelligen,
    # ausschliesslich intern verwendeten Laufzeitschluessel ersetzt.
    # Port 8182 wird nicht veroeffentlicht.
    api_keys __IRL4YOU_INTERNAL_STATS_KEY__;
    cors_header *;
    log_file /dev/stdout;
    log_level info;
    log_rate_limit_enabled 1;
    log_rate_limit_window 60;
    log_rate_limit_threshold 5;

    server {
        # Der vorgeschaltete IRLServer-Receiver entfernt die SRTLA-Huelle,
        # leitet die SRT-Pakete der gebuendelten Pfade aber transparent weiter.
        # Deshalb muss der interne SRT-Eingang die feste Reorder-Toleranz des
        # SRTLA-Modus verwenden. Wiederholungs-NAKs gelten nur fuer bestaetigte
        # Verluste; noch innerhalb der Bonding-Reorderfrist erwartete Pakete
        # werden ausgefiltert. Zu spaete Bereiche werden per DROP-Anforderung
        # auf allen aktiven Pfaden freigegeben.
        listen_player 8282;
        listen_publisher_srtla 8283;
        latency_min 1000;
        latency_max 8000;
        domain_player play;
        domain_publisher publish;
        # Kein gemeinsamer Standard-Stream: Jeder Sender muss eine eigene
        # Stream-ID im Format publish/live/<STREAM-KEY> mitsenden.
        backlog 100;
        # Der interne Publisher darf bei einer Mobilfunk-Umschaltung laenger
        # als die ausgehandelte SRT-Latenz stillstehen. Drei Sekunden waren
        # bei 4000 ms Latenz zu kurz und trennten den lokalen Relay-Pfad noch
        # waehrend reparierte Pakete ausstanden.
        idle_streams_timeout 15;
        # Der Sender startet mit Datenschutz-Verzoegerung (2 s) und doppelter Dekodierung langsamer: erstes Bild erst nach 6 bis 9 s.
        # Frist fuer das erste Datenpaket = ausgehandelte Latenz + diese Karenz (vorher eingebaut 3000).
        publisher_first_data_grace 30000;
        # OBS bleibt bei einem kurzen Senderausfall verbunden und wird beim
        # Wiederkehren des Publishers an den neuen Live-Kopf gesetzt.
        player_idle_streams_timeout 30;
        app {
            app_publisher live;
            app_player live;
        }
    }
}
